apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.yolvo.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolov5
  template:
    metadata:
      labels:
        app: yolov5
    spec:
      containers:
        - name: {{ .Values.yolvo.name }}
          image: {{ .Values.yolvo.image }}
          command: ["python", "watch_and_detect.py"]
          volumeMounts:
            - mountPath: /app/input
              name: yolov5-volume
              subPath: input
            - mountPath: /app/output
              name: yolov5-volume
              subPath: output

        - name: zabbix-agent
          image: zabbix/zabbix-agent:alpine-latest
          env:
            - name: ZBX_SERVER_HOST
              value: "{{ .Values.zabbix.server }}"   # this will come from values.yaml
          ports:
            - containerPort: 10050
          volumeMounts:
            - mountPath: /var/run
              name: run-volume


      volumes:
        - name: yolov5-volume
          persistentVolumeClaim:
            claimName: yolov5-pvc

        - name: run-volume
          emptyDir: {}
